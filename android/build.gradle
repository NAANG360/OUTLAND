plugins { id 'com.android.application' }

configurations {
    natives
}

android {
    namespace 'com.outland.game'
    compileSdk 36

    defaultConfig {
        applicationId 'com.outland.game'
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName '0.1.0'
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ["$buildDir/generated/gdxNatives"]
        }
    }
}

dependencies {
    implementation project(':core')
    implementation "com.badlogicgames.gdx:gdx-backend-android:1.14.2"

    natives "com.badlogicgames.gdx:gdx-platform:1.14.2:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-platform:1.14.2:natives-armeabi-v7a"
}

tasks.register("extractGdxNatives", Copy) {
    from(configurations.natives.collect { zipTree(it) }) {
        include "lib/**/*.so"
        eachFile {
            path = path.replaceFirst(/^lib\\//, "")
        }
        includeEmptyDirs = false
    }
    into "$buildDir/generated/gdxNatives"
}

tasks.named("preBuild") {
    dependsOn("extractGdxNatives")
}
