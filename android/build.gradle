plugins { id 'com.android.application' }

configurations {
    natives
}

android {
    namespace 'com.outland.game'
    compileSdk 36

    defaultConfig {
        applicationId 'com.outland.game'
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName '0.1.0'
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ["$buildDir/generated/gdxNatives"]
        }
    }
}

dependencies {
    implementation project(':core')
    implementation "com.badlogicgames.gdx:gdx-backend-android:1.14.2"

    natives "com.badlogicgames.gdx:gdx-platform:1.14.2:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-platform:1.14.2:natives-armeabi-v7a"
}

tasks.register("extractGdxNatives") {
    outputs.dir("$buildDir/generated/gdxNatives")

    doFirst {
        delete("$buildDir/generated/gdxNatives")
    }

    doLast {
        configurations.natives.files.each { nativeJar ->
            def abi = null
            if (nativeJar.name.endsWith("natives-arm64-v8a.jar")) {
                abi = "arm64-v8a"
            } else if (nativeJar.name.endsWith("natives-armeabi-v7a.jar")) {
                abi = "armeabi-v7a"
            }

            if (abi != null) {
                copy {
                    from zipTree(nativeJar)
                    include "*.so"
                    into "$buildDir/generated/gdxNatives/$abi"
                }
            }
        }
    }
}

tasks.named("preBuild") {
    dependsOn("extractGdxNatives")
}
