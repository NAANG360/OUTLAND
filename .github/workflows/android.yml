name: Build OUTLAND APK
on:
  workflow_dispatch:
  push:
    branches: [ main, 'feat/wasteland-vertical-slice', 'feat/wasteland-merge-ready', 'feat/wasteland-organic-world', 'fix/wasteland-codex-review', 'feat/wasteland-art-pass-2', 'engine/rebuild-60fps', 'engine/libgdx-template-base' ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Show Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          test -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" || find "${ANDROID_HOME}/cmdline-tools" -maxdepth 3 -name sdkmanager -type f
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Run core unit tests
        id: core_tests
        continue-on-error: true
        run: |
          set +e
          gradle --no-daemon :core:test --stacktrace --console=plain 2>&1 | tee core-test.log
          status=${PIPESTATUS[0]}
          mkdir -p core/build/ci
          cp core-test.log core/build/ci/core-test.log
          echo "${status}" > core/build/ci/core-test-exit.txt
          exit "${status}"
      - name: Collect test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OUTLAND-test-diagnostics-${{ github.run_id }}
          path: core/build/ci/
          if-no-files-found: error
      - name: Fail if core tests failed
        if: steps.core_tests.outcome == 'failure'
        run: exit 1
      - name: Build debug APK
        run: gradle --no-daemon :android:assembleDebug
      - name: Verify libGDX native payload
        run: |
          APK="$(find android/build/outputs/apk/debug -name '*.apk' -print -quit)"
          test -n "${APK}"
          echo "Inspecting ${APK}"
          unzip -l "${APK}" | grep -E 'lib/(arm64-v8a|armeabi-v7a)/libgdx\.so$'
          COUNT="$(unzip -l "${APK}" | grep -Ec 'lib/(arm64-v8a|armeabi-v7a)/libgdx\.so$')"
          test "${COUNT}" -eq 2
      - uses: actions/upload-artifact@v4
        with:
          name: OUTLAND-debug-apk
          path: android/build/outputs/apk/debug/*.apk
