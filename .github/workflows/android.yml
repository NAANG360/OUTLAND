name: Build OUTLAND APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub's Ubuntu runner already includes the Android SDK.
      # Avoid setup-android's legacy `sdkmanager tools` install request.
      - name: Show Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          test -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" || find "${ANDROID_HOME}/cmdline-tools" -maxdepth 3 -name sdkmanager -type f
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        run: gradle --no-daemon :android:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: OUTLAND-debug-apk
          path: android/build/outputs/apk/debug/*.apk
